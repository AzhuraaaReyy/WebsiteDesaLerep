name: Deploy Frontend ke GitHub Pages

on:
  push:
    branches: [main,frontend]
    paths:
      - "Frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

# Default minimal; izin deploy hanya diberikan ke job `deploy`.
permissions:
  contents: read

# Hanya satu deploy berjalan; run yang sedang deploy tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: Frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages membaca info situs Pages
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Varian WebP hanya dibuat ulang bila gambar sumber atau script optimasinya berubah.
      - name: Cache gambar teroptimasi
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Frontend/public/_img
          key: img-${{ hashFiles('Frontend/public/images/**', 'Frontend/scripts/optimize-images.mjs') }}

      - name: Optimasi gambar (WebP responsif)
        run: npm run images:optimize

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Contoh: /WebsiteDesaLerep (kosong bila memakai custom domain)
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: Frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
